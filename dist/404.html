<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b87"><title>길을 잃었어요 · GlobeHop</title><style>
:root{font-family:system-ui,sans-serif;color:#17324d;background:#f4f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #dbe7ef;border-radius:28px;padding:36px;text-align:center;box-shadow:0 18px 46px rgba(28,70,96,.12)}.emoji{font-size:72px}h1{font-size:32px;margin:12px 0 8px}p{color:#667a8e}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}button,a{min-height:44px;border-radius:12px;padding:0 16px;border:1px solid #dbe7ef;background:#fff;color:#17324d;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}.primary{background:#176b87;color:#fff;border-color:#176b87}</style></head><body><main class="card"><div class="emoji">🧭🌍</div><h1>지도 밖으로 나왔어요</h1><p>찾으려는 페이지가 없거나 주소가 바뀌었습니다. 홈으로 돌아가 새로운 장소를 검색해 보세요.</p><div class="actions"><a class="primary" id="home" href="./">홈으로 이동</a><button onclick="history.back()">이전 페이지</button><a id="search" href="./?focus=search">검색하기</a></div></main><script>const parts=location.pathname.split('/').filter(Boolean);const base=location.hostname.endsWith('github.io')&&parts.length?'/'+parts[0]+'/':'/';document.querySelector('#home').href=base;document.querySelector('#search').href=base+'?focus=search';</script></body></html>
